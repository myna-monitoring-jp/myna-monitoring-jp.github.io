<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>ページが見つかりません｜行政・マイナ関連 モニタリングポータル</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f6fa;
        color: #1d2433;
        font-family: 'Meiryo UI', 'Meiryo', 'Yu Gothic UI', 'Yu Gothic', Arial, sans-serif;
        line-height: 1.6;
      }
      .box {
        background: #fff;
        border: 1px solid #e3e7ee;
        border-radius: 14px;
        box-shadow: 0 2px 10px rgba(16, 24, 40, 0.055);
        padding: 28px 32px;
        max-width: 560px;
        margin: 20px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 13px;
        margin: 8px 0;
      }
      a.action {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 8px 14px;
        margin-top: 10px;
        border-radius: 8px;
        border: 1px solid #5d3fc1;
        background: #5d3fc1;
        color: #fff;
        font-size: 12px;
        font-weight: 800;
        text-decoration: none;
      }
      a.action:focus-visible {
        outline: 3px solid #7a5af8;
        outline-offset: 2px;
      }
      code {
        background: #f2f4f7;
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <h1>ページが見つかりません</h1>
      <p>
        このサイトはハッシュルーティング（<code>#/news</code> 形式）で動作しています。
        共有されたリンクが古い、またはパスが直接指定された可能性があります。
      </p>
      <p>ダッシュボードから各画面へ移動できます。</p>
      <!--
        ルートは相対パスで解決する。<org>.github.io/<repo>/ のようなサブディレクトリ配信でも
        正しくトップへ戻れるようにするため、絶対パスは使わない。
      -->
      <a class="action" href="./">ダッシュボードを開く</a>
    </main>
  </body>
</html>
