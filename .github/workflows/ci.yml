name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Validate data files
        run: |
          node scripts/validate-data.mjs public/data
          node scripts/validate-data.mjs public/sample-data

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
