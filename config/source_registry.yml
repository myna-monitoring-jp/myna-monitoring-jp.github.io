version: 1

# fetchable_feeds / watch_urls / _unfetchable は実装側の追記。
# 渡された Tier 定義はそのまま維持している。
#
# 追記した理由：
# Google News RSS の記事リンクは news.google.com のリダイレクトで、
#   1) robots.txt が全エージェントに Disallow: / を指定している
#   2) 記事IDは不透明なトークンで、元URLを復元できない
# ため本文を取得できない（2026-09-07 実測）。
# したがって Google News は「発見」専用とし、事実確定に使う本文は
# 実URLを持つ下記の情報源から取る。仕様§3の一次情報優先と同じ結論。

# 本文を取得できる情報源。ここが事実確定の材料になる。
fetchable_feeds:
  - id: digital-agency-news
    label: デジタル庁 新着
    url: https://www.digital.go.jp/rss/news.xml
    publisher: デジタル庁
    tier: 0
  - id: mhlw-news
    label: 厚生労働省 新着
    url: https://www.mhlw.go.jp/stf/news.rdf
    publisher: 厚生労働省
    tier: 0
  - id: soumu-news
    label: 総務省 新着
    url: https://www.soumu.go.jp/news.rdf
    publisher: 総務省
    tier: 0

# 定点観測するページ。RSSを持たないが重要なもの。
#
# link_pattern を書くと「一覧ページ」として扱い、子リンクを候補にする。
# ここが1件しか無かったため、2026-09-08 に次を丸ごと取りこぼしていた：
#   - 政府広報のマイナアプリTVCM（CM一覧にしか無い）
#   - 政府広報のマイナ救急 新聞広告（新聞広告一覧にしか無い）
#   - 地方厚生局の災害時受診特例の事務連絡（厚労省本省のRSSには載らない）
# いずれも 2026-09-08 に robots.txt 許可・HTTP 200・リンク抽出可を実測確認した。
#
# fetch_self: false は「一覧ページ自体は事象ではない」ものに付ける。
watch_urls:
  - id: mynaportal-api-status
    label: マイナポータルAPI 稼働状況・メンテナンス情報
    url: https://developers.digital.go.jp/documents/mynaportal-api/maintenance/
    publisher: デジタル庁
    tier: 0
    system_layer: マイナポータルAPI（自己情報取得）
    # 掲載日を持たないページ。日付が無いことを理由に落とさず毎日見る
    daily_observation: true

  # 政府広報のCM。マイナアプリCMはここにしか載らない
  - id: gov-online-commercials
    label: 政府広報オンライン CM等
    url: https://www.gov-online.go.jp/media/commercials/
    publisher: 政府広報オンライン
    tier: 0
    # 政府広報の掲載物は必ず広報物。本文に「紛失」「使えない」等の説明が入るため、
    # 本文判定に任せると障害・セキュリティ事案に化ける（実際に化けた）
    event_class: public_communication
    link_pattern: '/media/commercials/\d{6}/[\w-]+\.html$'
    max_links: 30
    fetch_self: false

  # 政府広報の新聞広告。マイナ救急の突出し広告はここ
  - id: gov-online-newspaper
    label: 政府広報オンライン 新聞広告
    url: https://www.gov-online.go.jp/media/newspaper_ads/
    publisher: 政府広報オンライン
    tier: 0
    event_class: public_communication
    link_pattern: '/newspaper/[\w]+/\d{6}/[\w-]+\.html$'
    max_links: 30
    fetch_self: false

  # 政府広報のマイナンバー特集。制度解説の更新を拾う
  - id: gov-online-mynumber
    label: 政府広報オンライン マイナンバー
    url: https://www.gov-online.go.jp/it_digital/my_number/
    publisher: 政府広報オンライン
    tier: 0
    event_class: public_communication
    link_pattern: 'gov-online\.go\.jp/article/\d{6}/[\w-]+\.html$'
    max_links: 20
    fetch_self: false

  # デジタル庁の普及・利活用ダッシュボード。保有率・利用率の更新
  - id: digital-dashboard
    label: マイナンバーカードの普及と利活用に関するダッシュボード
    url: https://www.digital.go.jp/resources/govdashboard/mynumber_card_penetration_usage
    publisher: デジタル庁
    tier: 0
    # 普及状況の更新。障害でも広報でもない
    event_class: positive_service_update
    daily_observation: true

  # 地方厚生局の医療保険関係通知。
  # 災害時の「マイナ保険証又は資格確認書等の提示等について」はここに出る。
  # 本省の新着RSSには載らないため、局ごとに見る必要がある。
  - id: kouseikyoku-chugokushikoku
    label: 中国四国厚生局 医療保険関係通知
    url: https://kouseikyoku.mhlw.go.jp/chugokushikoku/newpage_00855.html
    publisher: 中国四国厚生局
    tier: 0
    event_class: policy_change
    link_pattern: 'kouseikyoku\.mhlw\.go\.jp/.+\.(html|pdf)$'
    max_links: 40
    fetch_self: false

  - id: kouseikyoku-kantoshinetsu
    label: 関東信越厚生局
    url: https://kouseikyoku.mhlw.go.jp/kantoshinetsu/index.html
    publisher: 関東信越厚生局
    tier: 0
    event_class: policy_change
    link_pattern: 'kouseikyoku\.mhlw\.go\.jp/kantoshinetsu/.+\.(html|pdf)$'
    max_links: 40
    fetch_self: false

# アプリストアの評価。数値だけを定点観測する。
# レビュー本文（国民の声）は取得しない。個々のレビューを引用すると
# 非代表サンプルを声として扱うことになるため、数値のみに限る。
app_store_metrics:
  - id: myna-app-ios
    label: マイナアプリ（iOS）
    url: https://apps.apple.com/jp/app/id1476359069
    publisher: Apple App Store
    system_layer: マイナアプリ

# 実測で取得できないと確認済み。同じ調査を繰り返さないための記録。
_unfetchable:
  news_google: 'robots.txt が Disallow: / 。記事IDから元URLも復元できない。発見専用'
  mofa_go_jp: 'ブラウザUAでも403'
  iryohokenjyoho_portal: 'ServiceNow SPA。HTML本文は110字のみ'
  gov_online_rss: 'RSSは404。ただしGoogle Newsには索引されているため発見は可能'
  ppc_rss: 'RSSは404'
  j_lis: '403'
  lg_jp: 'RSSを持たない。Google News経由で発見のみ'
  app_store_reviews: '0件返却。実質廃止'
  x_and_yahoo_comments: '無料のAPIなし。反応の自動取得は不可能'

source_tiers:
  tier_0_primary:
    description: 制度、稼働状況、事故、対象人数、復旧、公式対応の確定に使う
    domains:
      digital_go_jp:
        domain: digital.go.jp
        categories: [policy, mynumber, mynaportal, jpki, pr, incident]
      digital_developers:
        domain: developers.digital.go.jp
        categories: [api_status, planned_maintenance, specifications]
      mhlw:
        domain: mhlw.go.jp
        categories: [myna_insurance, online_eligibility, medical_dx, disaster, pr]
      myna_portal:
        domain: myna.go.jp
        categories: [service_status, procedures]
      jlis_card:
        domain: kojinbango-card.go.jp
        categories: [card, certificate, operations]
      pension:
        domain: nenkin.go.jp
        categories: [pension, public_money_account, integration]
      ssk:
        domain: ssk.or.jp
        categories: [online_eligibility, disaster, payer_operations]
      kokuho:
        domain: kokuho.or.jp
        categories: [national_health_insurance, disaster]
      ppc:
        domain: ppc.go.jp
        categories: [privacy, mynumber_incidents]
      gov_online:
        domain: gov-online.go.jp
        categories: [advertising, campaigns, explainer]
      e_gov:
        domain: public-comment.e-gov.go.jp
        categories: [public_comment, regulation]
      mofa:
        domain: mofa.go.jp
        categories: [passport]
      fdma:
        domain: fdma.go.jp
        categories: [ambulance, disaster, myna_emergency]
      moj:
        domain: moj.go.jp
        categories: [residence_card, pr]
      local_government:
        domain_pattern: '*.lg.jp'
        categories: [local_incident, card_operations, insurance]
      municipalities:
        domain_patterns:
          - 'city.*.jp'
          - 'pref.*.jp'
          - 'town.*.jp'
          - 'vill.*.jp'
        categories: [local_incident, local_operations]

  tier_1_major_media:
    description: 発見、独立取材、社会的文脈、主要媒体波及の確認に使う
    domains:
      - nhk.or.jp
      - asahi.com
      - yomiuri.co.jp
      - mainichi.jp
      - nikkei.com
      - sankei.com
      - kyodonews.jp
      - jiji.com
      - news.tv-asahi.co.jp
      - newsdig.tbs.co.jp
      - fnn.jp
      - news.ntv.co.jp
      - mbc.co.jp
      - mbs.jp

  tier_2_specialist:
    description: 医療、IT、セキュリティ、自治体の技術・現場詳細に使う
    domains:
      - itmedia.co.jp
      - internet.watch.impress.co.jp
      - k-tai.watch.impress.co.jp
      - atmarkit.itmedia.co.jp
      - scan.netsecurity.ne.jp
      - jpcert.or.jp
      - ipa.go.jp
      - mf.jiho.jp
      - medical-saponet.mynavi.jp

  tier_3_reaction:
    description: 事実確定には使わず、論点・拡散規模・利用者体験に限定
    domains:
      - x.com
      - search.yahoo.co.jp
      - news.yahoo.co.jp
      - apps.apple.com
      - play.google.com

source_rules:
  current_service_status:
    preferred_tier: tier_0_primary
  affected_count:
    preferred_tier: tier_0_primary
    fallback: tier_1_major_media
    fallback_label: 報道によると
  incident_cause:
    preferred_tier: tier_0_primary
  public_reaction:
    preferred_tier: tier_3_reaction
  media_reach:
    use_independent_outlets_only: true
  press_release_reprints:
    count_as_independent_media: false
  syndicated_articles:
    count_as_independent_media: false
  social_claim_as_incident_fact:
    allowed: false

link_validation:
  timeout_seconds: 15
  follow_redirects: true
  allowed_status_codes: [200, 201, 202, 204, 301, 302, 303, 307, 308]
  flag_login_wall: true
  flag_deleted_social_post: true
  verify_title_matches_event: true
  external_target: _blank
  external_rel: noopener noreferrer
